<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <title>말랑말랑 퀴즈 놀이터</title>

  <!-- 글꼴: 불러오지 못해도(학교 네트워크 등) 앱은 기본 글꼴로 잘 보여요 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./style.css?v=2.5">
  <link rel="stylesheet" href="./games.css?v=2.5">
</head>
<body>
  <div id="app"><div class="boot"><p>불러오는 중이에요…</p></div></div>
  <div id="banners"></div>
  <div id="toasts"></div>
  <div id="version"></div>
  <noscript><p style="padding:24px">이 앱은 자바스크립트가 켜져 있어야 해요.</p></noscript>

  <script>
    // 앱이 시작되지 못했을 때(파일을 빠뜨렸거나, Firebase 프로그램을 못 불러왔을 때) 안내를 보여 줘요
    function malrangBootFail(reason) {
      var app = document.getElementById('app');
      if (!app || window.__malrangBooted) return;
      app.innerHTML = '';
      var box = document.createElement('div');
      box.className = 'boot';
      var lines = [
        '앱을 시작하지 못했어요.',
        reason,
        '확인해 보세요: ① 인터넷이 연결되어 있나요? ② GitHub에 index.html, style.css, games.css, guide.html, version.json, js 폴더(안에 파일들)가 모두 올라가 있나요? ③ 올린 뒤 1~2분 기다리고 Ctrl+Shift+R로 새로고침해 보세요.'
      ];
      lines.forEach(function (t, i) {
        var p = document.createElement('p');
        p.textContent = t;
        if (i === 0) p.style.fontWeight = '700';
        box.appendChild(p);
      });
      app.appendChild(box);
    }
    setTimeout(function () { malrangBootFail('8초가 지나도 시작되지 않았어요. (Firebase 프로그램을 불러오지 못했을 수 있어요)'); }, 8000);
  </script>

  <script>
    // ── 파일 버전 붙이기(예전 파일이 브라우저에 남아 있어도 새 파일을 받게 해요) ──
    // 모든 js 파일 이름 뒤에 ?v=버전 을 붙여서 불러와요. 새 버전을 올리면 주소가 바뀌어서 예전 파일을 다시 쓰지 않아요.
    // (아주 오래된 브라우저는 이 기능을 몰라서 그냥 원래 이름으로 불러와요. 그래도 앱은 똑같이 동작해요.)
    (function () {
      var BUILD = '2.5';   // ← 새 버전을 만들 때 js/config.js의 APP_VERSION, version.json, 아래 FILES와 함께 바뀌어요
      var FILES = ["app", "config", "core", "db", "forms", "gamecore", "gamescreen", "live", "packs", "present", "quizgen", "results", "speed", "student", "student-input", "study", "teacher", "teacher-data", "teacher-games", "teacher-questions", "teacher-settings", "teacher-students", "teacher-words", "tele", "tele-core", "tele-draw", "tele-view", "testmode", "text", "ui", "word-export", "words", "xlsx-lite"];   // FILES
      window.MALRANG_BUILD = BUILD;
      var r = location.search.match(/[?&]_r=([\w-]+)/);
      var q = '?v=' + BUILD + (r ? '&r=' + r[1] : '');
      try {
        var map = { imports: {} };
        FILES.forEach(function (f) { map.imports['./js/' + f + '.js'] = './js/' + f + '.js' + q; });
        var im = document.createElement('script');
        im.type = 'importmap';
        im.textContent = JSON.stringify(map);
        document.head.appendChild(im);
      } catch (e) { /* 지원하지 않으면 건너뛰어요 */ }
      var s = document.createElement('script');
      s.type = 'module';
      s.src = './js/app.js' + q;
      s.onerror = function () { malrangBootFail('필요한 파일을 불러오지 못했어요.'); };
      document.head.appendChild(s);

      // js 폴더의 파일이 예전 것이면(업로드를 빠뜨렸을 때) 알려 줘요: 새 프로그램은 시작하면 __malrangVersion 표시를 남겨요
      setTimeout(function () {
        var box = document.getElementById('banners');
        if (!window.__malrangBooted || window.__malrangVersion || !box) return;
        var d = document.createElement('div');
        d.className = 'banner';
        d.setAttribute('data-key', 'oldjs');
        d.textContent = '프로그램(js 폴더) 파일이 예전 버전이에요. GitHub에 js 폴더 안의 파일을 모두 올렸는지 확인하고, Ctrl+Shift+R로 새로고침해 주세요.';
        box.appendChild(d);
      }, 5000);

      // 이 index.html이 예전 것인지 확인해요(서버의 version.json은 항상 새로 받아 와요). 예전 것이면 한 번만 자동으로 새로 열어요.
      try {
        fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (j) {
            if (!j || !j.build || String(j.build) === BUILD) return;
            var key = 'malrang_stale_' + j.build, already = true;
            try { already = !!sessionStorage.getItem(key); sessionStorage.setItem(key, '1'); } catch (e) { already = true; }
            if (!already) {
              var u = new URL(location.href);
              u.searchParams.set('_r', Date.now().toString(36));
              location.replace(u.toString());
              return;
            }
            window.MALRANG_STALE = String(j.build);
            window.dispatchEvent(new Event('malrang-stale'));
          })
          .catch(function () { /* version.json이 없거나 못 읽어도 앱은 그대로 동작해요 */ });
      } catch (e) { /* 무시 */ }
    })();
  </script>
</body>
</html>

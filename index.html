<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <title>말랑말랑 퀴즈 놀이터</title>

  <!-- 글꼴: 불러오지 못해도(학교 네트워크 등) 앱은 기본 글꼴로 잘 보여요 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"><div class="boot"><p>불러오는 중이에요…</p></div></div>
  <div id="banners"></div>
  <div id="toasts"></div>
  <div id="version"></div>
  <noscript><p style="padding:24px">이 앱은 자바스크립트가 켜져 있어야 해요.</p></noscript>

  <script>
    // 앱이 시작되지 못했을 때(파일을 빠뜨렸거나, Firebase 프로그램을 못 불러왔을 때) 안내를 보여 줘요
    function malrangBootFail(reason) {
      var app = document.getElementById('app');
      if (!app || window.__malrangBooted) return;
      app.innerHTML = '';
      var box = document.createElement('div');
      box.className = 'boot';
      var lines = [
        '앱을 시작하지 못했어요.',
        reason,
        '확인해 보세요: ① 인터넷이 연결되어 있나요? ② GitHub에 index.html, style.css, js 폴더(안에 파일 8개)가 모두 올라가 있나요? ③ 올린 뒤 1~2분 기다리고 Ctrl+Shift+R로 새로고침해 보세요.'
      ];
      lines.forEach(function (t, i) {
        var p = document.createElement('p');
        p.textContent = t;
        if (i === 0) p.style.fontWeight = '700';
        box.appendChild(p);
      });
      app.appendChild(box);
    }
    setTimeout(function () { malrangBootFail('8초가 지나도 시작되지 않았어요. (Firebase 프로그램을 불러오지 못했을 수 있어요)'); }, 8000);
  </script>
  <script type="module" src="./js/app.js" onerror="malrangBootFail('필요한 파일을 불러오지 못했어요.')"></script>
</body>
</html>
